{% extends "base.html" %}
{% block title %}Reset password — BiasharaSmart AI{% endblock %}
{% block content %}
<section class="auth-wrap"><div class="auth-aside"><span class="eyebrow">SECURE RECOVERY</span><h1>A fresh start for <span>your account.</span></h1><p>Reset codes expire after 10 minutes and can only be used once.</p></div>
<div class="auth-card"><h2>Reset your password</h2><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email or registered phone number<input name="identifier" autocomplete="username" maxlength="255" required></label><label>6-digit reset code<input name="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" required></label><label>New password<input name="password" type="password" minlength="10" autocomplete="new-password" required></label><label>Confirm new password<input name="confirm_password" type="password" minlength="10" autocomplete="new-password" required></label><button class="button primary full" type="submit">Update password <span>→</span></button></form><p class="switch-auth"><a href="{{ url_for('forgot_password') }}">Request another code</a></p></div></section>
{% endblock %}
